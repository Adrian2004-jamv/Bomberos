<header class="navbar">
    <button
        class="menu-toggle"
        type="button"
        data-sidebar-toggle
        aria-controls="sidebar"
        aria-expanded="false"
        aria-label="Abrir menú principal"
    >
        <i class="ti ti-menu-2" aria-hidden="true"></i>
    </button>
    <button
        class="tour-btn"
        type="button"
        onclick="window.bomberosTour && window.bomberosTour.iniciar()"
        aria-label="Iniciar guía interactiva"
        title="Guía del sistema"
    >
        <i class="ti ti-help-circle" aria-hidden="true"></i>
        <span>Ayuda</span>
    </button>
</header>

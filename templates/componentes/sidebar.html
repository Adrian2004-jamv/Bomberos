{% load static %}
<aside class="sidebar" id="sidebar" aria-label="Navegación principal">
    <div class="sidebar__brand">
        <img
            class="brand-logo"
            src="{% static 'img/logos/Logo.png' %}"
            alt="Emblema del Cuerpo de Bomberos"
        >
        <span>
            <strong>Bomberos Cotopaxi</strong>
            <small>Gestión provincial</small>
        </span>
    </div>

    <nav class="sidebar__nav">
        <a class="nav-item{% if request.resolver_match.namespace == 'core' %} nav-item--active{% endif %}" href="{% url 'core:inicio' %}"{% if request.resolver_match.namespace == 'core' %} aria-current="page"{% endif %}>
            <span aria-hidden="true">⌂</span> Inicio
        </a>
        <a class="nav-item{% if request.resolver_match.namespace == 'instituciones' %} nav-item--active{% endif %}" href="{% url 'instituciones:lista' %}"{% if request.resolver_match.namespace == 'instituciones' %} aria-current="page"{% endif %}>
            <span aria-hidden="true">▦</span> Instituciones
        </a>
        <a class="nav-item{% if request.resolver_match.namespace == 'inventario' %} nav-item--active{% endif %}" href="{% url 'inventario:lista' %}"{% if request.resolver_match.namespace == 'inventario' %} aria-current="page"{% endif %}>
            <span aria-hidden="true">□</span> Inventario
        </a>
        <span class="nav-item nav-item--disabled" aria-disabled="true"><span aria-hidden="true">◇</span> Capacidades</span>
        <span class="nav-item nav-item--disabled" aria-disabled="true"><span aria-hidden="true">△</span> Emergencias</span>
        <span class="nav-item nav-item--disabled" aria-disabled="true"><span aria-hidden="true">◎</span> Mapa provincial</span>
    </nav>

    <div class="sidebar__footer">
        <span class="status-dot" aria-hidden="true"></span>
        Módulos en construcción
    </div>
</aside>
